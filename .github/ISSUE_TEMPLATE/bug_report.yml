name: Bug report
description: Something janitor did (or proposed) was wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please never paste your token. Repository names can be replaced with placeholders.
  - type: input
    id: version
    attributes:
      label: janitor version
      description: Output of `janitor --version`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.5.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: janitor fix --only description
    validations:
      required: true
  - type: dropdown
    id: applied
    attributes:
      label: Was --apply used?
      options:
        - No, dry run only
        - Yes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the relevant output. For wrong descriptions or topics, include the README or manifest excerpt that caused it.
    validations:
      required: true
